[package]
name = "retraktor-hid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Traktor Kontrol & MX2 (0x17CC) USB HID/NHL report decoder, S4MK3 Haptic Drive platter protocol, OffscreenView RGB565 USB Bulk display streamer, ALSA MIDI .tsi router, and Linux udev generator"

[dependencies]
retraktor-core = { path = "../retraktor-core" }
retraktor-formats = { path = "../retraktor-formats" }
serde_json = "1.0"

# renameat2(RENAME_EXCHANGE): swap an imported rules file into place and keep exactly what it displaced.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
