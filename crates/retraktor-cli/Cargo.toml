[package]
name = "retraktor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line inspector and verification tool for ReTraktor (.nml, .tsi, CSI QML, property bus, udev)"

[dependencies]
retraktor-core = { path = "../retraktor-core" }
retraktor-formats = { path = "../retraktor-formats" }
retraktor-library = { path = "../retraktor-library" }
retraktor-dsp = { path = "../retraktor-dsp" }
retraktor-audio = { path = "../retraktor-audio" }
retraktor-hid = { path = "../retraktor-hid" }
crossterm = "0.28"
minifb = "0.29"

[package.metadata.deb]
name = "retraktor"
maintainer = "ReTraktor Project <https://github.com/adamtdm/ReTraktor>"
copyright = "2026, ReTraktor Project Contributors"
license = "MIT OR Apache-2.0"
extended-description = """
Clean-room Linux re-implementation of Traktor Pro 4 in Rust.
Includes 4-deck audio/DSP engine, CSI 1.0 QML compatibility, .nml and .tsi formats,
and Traktor Kontrol & MX2 HID and USB bulk display support.
"""
section = "sound"
priority = "optional"
depends = "$auto, libpipewire-0.3-0, wireplumber, libasound2, libhidapi-hidraw0, libusb-1.0-0"
maintainer-scripts = "debian"
assets = [
    ["target/release/retraktor-cli", "usr/bin/retraktor-cli", "755"],
    ["assets/retraktor-wrapper.sh", "usr/bin/retraktor", "755"],
    ["assets/99-retraktor-ni.rules", "lib/udev/rules.d/99-retraktor-ni.rules", "644"],
    ["assets/99-retraktor-realtime.conf", "etc/security/limits.d/99-retraktor-realtime.conf", "644"],
    ["assets/retraktor.desktop", "usr/share/applications/retraktor.desktop", "644"],
    ["assets/retraktor.svg", "usr/share/icons/hicolor/scalable/apps/retraktor.svg", "644"],
]
